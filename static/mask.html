<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>DeltaX · Awaiting Reveal</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#e9e9e6}
    body{min-height:100svh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(90vw,850px);text-align:center;padding:35px 0}
    h1{font-size:clamp(30px,5.1vw,66px);font-weight:380;letter-spacing:-.045em;line-height:1.13;margin:0}
    .dot{color:#8a8a87}
    ::selection{background:#444;color:#fff}
  </style>
</head>
<body>
  <main><h1>Everything will be revealed soon<span class="dot">.</span></h1></main>
  <script>
    // Poll only the non-sensitive status endpoint. Never fetch challenge data.
    (function(){
      let busy=false;
      async function check(){
        if(busy)return; busy=true;
        try{
          const controller=new AbortController();
          const timeout=setTimeout(()=>controller.abort(),3500);
          try{
            const r=await fetch('/api/visibility',{cache:'no-store',signal:controller.signal});
            if(r.ok && (await r.json()).revealed)location.replace('/?revealed='+Date.now());
          }finally{clearTimeout(timeout);}
        }catch(e){}finally{busy=false;}
      }
      setInterval(check,2500);
      check();
    })();
  </script>
</body>
</html>
